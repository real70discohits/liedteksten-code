[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: fast, isolated tests of pure/component functions (no CLI, no subprocess)
    integration: end-to-end golden tests that run a real script against testdata

filterwarnings =
    # lark (a commentjson dependency) emits these on Python 3.13+; not our code.
    ignore:module 'sre_.*' is deprecated:DeprecationWarning
